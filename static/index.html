<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivo 账号信息查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-group input::placeholder {
            color: #aaa;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result.success {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            display: block;
        }
        
        .result.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            display: block;
        }
        
        .result.warning {
            background: #fffbeb;
            border: 1px solid #fde68a;
            display: block;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .result.success .result-title { color: #0369a1; }
        .result.error .result-title { color: #dc2626; }
        .result.warning .result-title { color: #d97706; }
        
        .info-grid {
            display: grid;
            gap: 12px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        
        .info-label {
            color: #6b7280;
            font-size: 14px;
        }
        
        .info-value {
            color: #111827;
            font-weight: 500;
            font-size: 14px;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 12px;
        }
        
        .icon {
            font-size: 20px;
        }
        
        .tips {
            margin-top: 16px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
        }
        
        .tips strong {
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Vivo 账号查询</h1>
            <p>输入手机号查询关联的 Vivo 账号信息</p>
        </div>
        
        <div class="input-group">
            <label for="phone">手机号码</label>
            <input type="tel" id="phone" placeholder="请输入11位手机号" maxlength="11" autocomplete="off">
        </div>
        
        <button class="btn" id="queryBtn" onclick="queryAccount()">
            开始查询
        </button>
        
        <div class="result" id="result"></div>
        
        <div class="tips">
            <strong>💡 使用提示：</strong><br>
            • 请确保输入正确的11位手机号码<br>
            • 如遇滑块验证，请切换至移动网络重试<br>
            • 查询结果仅供参考
        </div>
        
        <div class="footer">
            <p>官方频道 - @Jay_Chou_fenxiang</p>
        </div>
    </div>

    <script>
        document.getElementById('phone').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryAccount();
            }
        });
        
        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });
        
        async function queryAccount() {
            const phone = document.getElementById('phone').value.trim();
            const btn = document.getElementById('queryBtn');
            const resultDiv = document.getElementById('result');
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showResult('error', '❌ 手机号格式不正确', '请输入正确的11位手机号码');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>查询中...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phone: phone })
                });
                
                const data = await response.json();
                
                if (data.need_slider) {
                    showResult('warning', '⚠️ 需要滑块验证', 
                        '请关闭 WiFi 网络，切换至移动网络后重试。移动网络环境下通常可以绕过滑块验证。');
                } else if (data.need_captcha) {
                    showResult('warning', '⚠️ 需要图形验证码', 
                        '请关闭 WiFi 网络，切换至移动网络后重试。');
                } else if (!data.success) {
                    showResult('error', '❌ 查询失败', data.error || '未知错误，请稍后重试');
                } else {
                    const respData = data.data || {};
                    if (respData.code !== "0" && respData.code !== 0) {
                        showResult('error', '❌ 账号不存在', respData.msg || '未找到该手机号关联的账号');
                    } else {
                        const userList = respData.data?.userInfoList || [{}];
                        const user = userList[0] || {};
                        
                        const infoHtml = `
                            <div class="info-grid">
                                <div class="info-item">
                                    <span class="info-label">👤 昵称</span>
                                    <span class="info-value">${user.nickName || '无'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">📧 绑定邮箱</span>
                                    <span class="info-value">${user.bindEmail || '无'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">📱 绑定手机</span>
                                    <span class="info-value">${user.bindPhone || '无'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">🆔 实名信息</span>
                                    <span class="info-value">${user.realNameInfo || '无'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">🔑 OpenID</span>
                                    <span class="info-value" style="font-size:12px">${user.openid || '无'}</span>
                                </div>
                            </div>
                        `;
                        showResult('success', '✅ 查询成功', infoHtml);
                    }
                }
            } catch (error) {
                showResult('error', '❌ 网络错误', '无法连接到服务器，请检查网络后重试');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '开始查询';
            }
        }
        
        function showResult(type, title, content) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            
            const isHtml = content.includes('<');
            resultDiv.innerHTML = `
                <div class="result-title">
                    <span class="icon">${type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '❌'}</span>
                    ${title}
                </div>
                ${isHtml ? content : `<p style="color: #4b5563; line-height: 1.6;">${content}</p>`}
            `;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
